services:
  # 1. FastAPI AI 서버 (먼저 켜져야 함)
  fastapi-server:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    ports:
      - "8000:8000"
    restart: always

  # 2. Node.js 백엔드 서버
  nodejs-server:
    build:
      context: .
      dockerfile: Dockerfile.node
    ports:
      - "3000:3000"
    environment:
      - FASTAPI_URL=http://fastapi-server:8000
    env_file:
      - ./cookit_server/.env  # ⭐️ 경로를 cookit_server 폴더 안쪽으로 정확히 수정했습니다!
    depends_on:
      - fastapi-server
    restart: always